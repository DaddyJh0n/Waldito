<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Waldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;overflow:hidden;color:#fff;font-family:'Cormorant Garamond',serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  .veil{position:fixed;inset:0;background:#000;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;cursor:pointer;transition:opacity 2.4s ease}
  .veil.gone{opacity:0;pointer-events:none}
  .veil .for{font-style:italic;font-weight:300;font-size:22px;letter-spacing:.06em;color:#d9c3c6;opacity:0;animation:in 2s .4s forwards}
  .ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,60,80,.7);position:relative;opacity:0;animation:in 2s 1.2s forwards}
  .ring::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,60,80,.6);animation:ping 2.4s 2s infinite}
  .ring::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ff3347;box-shadow:0 0 14px 4px rgba(255,40,60,.8)}
  @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
  @keyframes in{to{opacity:1}}
  .caption{position:fixed;left:0;right:0;bottom:max(38px,env(safe-area-inset-bottom));z-index:3;text-align:center;pointer-events:none;
    font-weight:300;font-size:13px;letter-spacing:.55em;text-transform:uppercase;color:rgba(255,225,228,.78);opacity:0;transition:opacity 3s}
  .caption.on{opacity:1}
  .hint{position:fixed;left:0;right:0;top:max(26px,env(safe-area-inset-top));z-index:3;text-align:center;pointer-events:none;
    font-style:italic;font-size:15px;color:rgba(255,200,205,.55);opacity:0;transition:opacity 1.5s}
  .hint.on{opacity:1}
  .mute{position:fixed;top:14px;right:14px;z-index:4;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;cursor:pointer}
  .mute.on{display:flex}
  .mute svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.6;opacity:.75}
  .err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;color:#d9c3c6;z-index:9}
</style>
</head>
<body>
<div class="veil" id="veil">
  <div class="for">para Waldo</div>
  <div class="ring"></div>
</div>
<div class="hint" id="hint">toca el cielo</div>
<div class="caption" id="caption">Feliz cumpleaños</div>
<button class="mute" id="mute" aria-label="Sonido">
  <svg viewBox="0 0 24 24" id="muteIcon"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
</button>
<div class="err" id="err">Ábrelo en un navegador con WebGL activado para ver la galaxia.</div>

<script>
(() => {
const $ = s => document.querySelector(s);

const PI = Math.PI;

/* ================= Math ================= */

}

const FOV = 60 * PI / 180;

/* ================= Text targets ================= */

  const c = document.createElement('canvas'); c.width = 1200; c.height = 360;

/* ================= Shaders ================= */

  precision mediump float;

  precision highp float;
  attribute vec3 aPos; attribute vec3 aColor; attribute float aSize;
  uniform mat4 uProj, uView; uniform float uSize, uSpin;
  varying vec3 vC;
  ${ROT}
  void main(){ vec4 mv = uView * vec4(spinIt(aPos, uSpin), 1.0); gl_Position = uProj * mv;

  precision mediump float; varying vec3 vC; uniform float uFade;

  uniform mat4 uProj, uView; uniform float uTime, uPx; varying float vA;
  void main(){ vec4 mv = uView * vec4(aPos, 1.0); gl_Position = uProj * mv;

const meteorProg = program(`
  precision highp float;
  attribute vec3 aPos; attribute float aA; uniform mat4 uProj, uView; uniform float uPx; varying float vA;
  void main(){ vA = aA; gl_Position = uProj * uView * vec4(aPos, 1.0); gl_PointSize = (1.0 + aA*3.0) * uPx; }`, `
  precision mediump float; varying float vA; uniform float uL;

const glowProg = program(`
  attribute vec2 aQ; void main(){ gl_Position = vec4(aQ, 0.0, 1.0); }`, `

const quadBuf = buffer(new Float32Array([-1, -1, 3, -1, -1, 3]));

/* ================= Galaxy data ================= */

let G = null, D = null, S = null;

async function build() {

    dp.set([Math.cos(br + sp) * rr, rand(-.12, .12), Math.sin(br + sp) * rr], i * 3);

/* ================= Meteors ================= */

/* ================= Camera (orbit) ================= */
const cam = { theta: -1.3, phi: .55, r: 70 };

const pointers = new Map(); let pinch0 = 0, down = null;

/* ================= Audio ================= */
let ac = null, out = null, muted = false;

    f.type = 'lowpass'; f.frequency.setValueAtTime(380, t); f.frequency.linearRampToValueAtTime(900, t + dur / 2); f.frequency.linearRampToValueAtTime(380, t + dur + 2);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.018, t + 2.5); g.gain.setValueAtTime(.018, t + dur - .5); g.gain.linearRampToValueAtTime(0, t + dur + 2.5);
    o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 2.6);
  }
  setTimeout(padLoop, dur * 1000);
}
function bell(midi, t, v = .05, len = 3) {
  for (const [mul, amp] of [[1, 1], [2.01, .35], [3.98, .12]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = hz(midi) * mul;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * amp, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + len / mul);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + len);
  }
}
const PENTA = [72, 74, 76, 79, 81, 84, 86, 88];
let melodyOn = false;
function sparkleLoop() {
  if (!ac) return;
  if (!melodyOn && Math.random() < .7) bell(PENTA[(Math.random() * PENTA.length) | 0], ac.currentTime + .05, .022, 4);
  setTimeout(sparkleLoop, rand(1300, 3200));
}
function playBirthday() {
  if (!ac || melodyOn) return; melodyOn = true;
  const S = [[67, .75], [67, .25], [69, 1], [67, 1], [72, 1], [71, 2], [67, .75], [67, .25], [69, 1], [67, 1], [74, 1], [72, 2],
             [67, .75], [67, .25], [79, 1], [76, 1], [72, 1], [71, 1], [69, 2], [77, .75], [77, .25], [76, 1], [72, 1], [74, 1], [72, 3]];
  let t = ac.currentTime + .3; const beat = .52;
  for (const [n, b] of S) { bell(n + 12, t, .045, 3.5); t += b * beat; }
  setTimeout(() => melodyOn = false, (t - ac.currentTime) * 1000);
}
$('#mute').addEventListener('click', e => {
  e.stopPropagation(); muted = !muted;
  if (out) out.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .3);
  $('#muteIcon').innerHTML = muted ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'
                                   : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>';
});

/* ================= Story ================= */
let mixTarget = 0, mix = 0, formed = false, introDone = false, saved = null, started = false;
function toggleName() {
  if (!introDone || tween) return;
  formed = !formed;
  $('#hint').classList.remove('on');
  if (formed) {
    saved = { ...cam }; interactive = false; autoRot = false; vTheta = vPhi = 0;
    moveCam({ theta: 0, phi: PI / 2, r: textDist() }, 2600);
    mixTarget = 1; playBirthday();
  } else {
    mixTarget = 0;
    moveCam(saved || HOME(), 3000, () => { interactive = true; autoRot = true; });
  }
}
$('#veil').addEventListener('click', () => {
  if (started) return; started = true;
  initAudio();
  $('#veil').classList.add('gone');
  $('#mute').classList.add('on');
  moveCam(HOME(), 9000, () => {
    introDone = true; interactive = true;
    $('#caption').classList.add('on');
    setTimeout(() => { if (!formed) $('#hint').classList.add('on'); }, 2500);
    setTimeout(() => $('#hint').classList.remove('on'), 9500);
  });
});

/* ================= Render loop ================= */
let last = performance.now(), T = 0, spin = 0, nextMeteor = 6;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .05); last = now; T += dt;

  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    for (const key of ['theta', 'phi', 'r']) cam[key] = tween.from[key] + (tween.to[key] - tween.from[key]) * e;
    if (k >= 1) { const d = tween.done; tween = null; d && d(); }
  } else if (interactive) {
    if (!pointers.size) {
      vTheta *= .94; vPhi *= .94;
      cam.theta += vTheta + (autoRot ? dt * .045 : 0);
      cam.phi = Math.min(PI - .12, Math.max(.12, cam.phi + vPhi));
    }
  }
  mix += (mixTarget - mix) * Math.min(1, dt * 1.1); if (Math.abs(mixTarget - mix) < .002) mix = mixTarget;
  spin += dt * .22 * (1 - mix);

  const eye = [cam.r * Math.sin(cam.phi) * Math.sin(cam.theta), cam.r * Math.cos(cam.phi), cam.r * Math.sin(cam.phi) * Math.cos(cam.theta)];
  const view = lookAt(eye, [0, 0, 0]), proj = perspective(FOV, W / H, .05, 200);

  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!G) return;

  // background stars
  gl.useProgram(starProg.p);
  bindAttrs(starProg, [['aPos', S.pos, 3], ['aSize', S.size, 1], ['aRand', S.rnd, 1]]);
  gl.uniformMatrix4fv(starProg.u.uProj, false, proj); gl.uniformMatrix4fv(starProg.u.uView, false, view);
  gl.uniform1f(starProg.u.uTime, T); gl.uniform1f(starProg.u.uPx, DPR);
  gl.drawArrays(gl.POINTS, 0, S.n);

  // core glow
  const clip = mulVec(proj, mulVec(view, [0, 0, 0, 1]));
  if (clip[3] > 0) {
    const cx = (clip[0] / clip[3] * .5 + .5) * cv.width, cy = (clip[1] / clip[3] * .5 + .5) * cv.height;
    const rad = 1.9 * (1 / Math.tan(FOV / 2)) / clip[3] * cv.height / 2;
    gl.useProgram(glowProg.p); bindAttrs(glowProg, [['aQ', quadBuf, 2]]);
    gl.uniform2f(glowProg.u.uC, cx, cy); gl.uniform1f(glowProg.u.uR, rad); gl.uniform1f(glowProg.u.uI, 1 - mix * .85);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // dust
  gl.useProgram(dustProg.p);
  bindAttrs(dustProg, [['aPos', D.pos, 3], ['aColor', D.col, 3], ['aSize', D.size, 1]]);
  gl.uniformMatrix4fv(dustProg.u.uProj, false, proj); gl.uniformMatrix4fv(dustProg.u.uView, false, view);
  gl.uniform1f(dustProg.u.uSize, 300 * DPR); gl.uniform1f(dustProg.u.uSpin, spin); gl.uniform1f(dustProg.u.uFade, 1 - mix);
  gl.drawArrays(gl.POINTS, 0, D.n);

  // galaxy
  gl.useProgram(galaxyProg.p);
  bindAttrs(galaxyProg, [['aPos', G.pos, 3], ['aTarget', G.tgt, 3], ['aColor', G.col, 3], ['aSize', G.size, 1], ['aRand', G.rnd, 1]]);
  gl.uniformMatrix4fv(galaxyProg.u.uProj, false, proj); gl.uniformMatrix4fv(galaxyProg.u.uView, false, view);
  gl.uniform1f(galaxyProg.u.uTime, T); gl.uniform1f(galaxyProg.u.uMix, mix);
  gl.uniform1f(galaxyProg.u.uSize, 30 * DPR); gl.uniform1f(galaxyProg.u.uSpin, spin);
  gl.drawArrays(gl.POINTS, 0, G.n);

  // meteors
  if (started && T > nextMeteor) { spawnMeteor(); nextMeteor = T + rand(4, 10); }
  if (meteors.length) {
    gl.useProgram(meteorProg.p);
    gl.uniformMatrix4fv(meteorProg.u.uProj, false, proj); gl.uniformMatrix4fv(meteorProg.u.uView, false, view);
    gl.uniform1f(meteorProg.u.uPx, DPR);
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.p = [m.p[0] + m.d[0], m.p[1] + m.d[1], m.p[2] + m.d[2]];
      m.arr.copyWithin(3, 0, (MN - 1) * 3); m.arr.set(m.p, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.buf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, m.arr);
      m.life -= .012;
      bindAttrs(meteorProg, [['aPos', m.buf, 3], ['aA', meteorABuf, 1]]);
      gl.uniform1f(meteorProg.u.uL, Math.min(1, m.life * 2));
      gl.drawArrays(gl.POINTS, 0, MN);
      if (m.life <= 0) { gl.deleteBuffer(m.buf); meteors.splice(i, 1); }
    }
  }
}
build().catch(e => { console.error(e); $('#err').style.display = 'flex'; });
requestAnimationFrame(frame);
})();
</script>
